# Default: docker compose up -d --wait starts Azurite, the local Azure Storage emulator used to debug
# uploads from the Windows target and to run the DcimCloudSync.Storage.Azure.Tests integration tests.
# There are no profiles. Endpoint: Blob http://127.0.0.1:10000/devstoreaccount1.
# Emulator state is disposable and kept outside the working tree in a named volume.
services:

  #https://github.com/azure/azurite
  azurite:
    # Upstream publishes no major alias; retain this verified release tag.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    # Blob only. --skipApiVersionCheck accepts the newest service version sent by current Azure SDKs.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    ports:
      - 127.0.0.1:10000:10000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const socket = require('net').connect(10000, '127.0.0.1', () => { socket.end(); process.exit(0); });
          socket.on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  azurite_data:
