name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  #Unsigned bundle build; Play publication is enabled separately once signing secrets exist.
  build:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/deploy-maui-android.yml@v1
    permissions:
      contents: read
    with:
      project: src/DcimCloudSync/DcimCloudSync.csproj
      app-display-version: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      app-version-code: ${{ github.run_number }}

  #Self-contained unpackaged Windows development build, uploaded as a short-lived artifact for manual testing.
  build-windows:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/build-maui-windows.yml@v1
    permissions:
      contents: read
    with:
      project: src/DcimCloudSync/DcimCloudSync.csproj
      app-display-version: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      app-version-code: ${{ github.run_number }}

  tests:
    needs: [versioning]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: src/DcimCloudSync.Core.Tests/DcimCloudSync.Core.Tests.csproj
            storage: false
          - project: src/DcimCloudSync.Storage.Azure.Tests/DcimCloudSync.Storage.Azure.Tests.csproj
            storage: true
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    permissions:
      contents: read
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: ${{ matrix.project }}
      test-compose-file: docker-compose.yml
      test-compose-services: ${{ matrix.storage && '["azurite"]' || '[]' }}

  #Sideload APK signed with the shared sideload keystore, uploaded as a short-lived artifact for manual installs.
  #build-apk.ps1 is the same script used locally, so CI and local APKs share signing and version codes and update
  #each other in place.
  #TODO: Move this into the shared deploy-maui-android workflow (APK package format, sideload signing and artifact
  #upload inputs) once it has built reliably across a few releases; it stays local while the approach is proven.
  #TODO: Read the sideload keystore from Azure Key Vault through GitHub OIDC instead of repository secrets once this
  #repository has a federated Azure identity; build-apk.ps1 already reads Key Vault through ANDROID_SIGNING_KEY_VAULT.
  build-apk:
    needs: [versioning]
    #Dependabot and fork pull requests receive no secrets, so they cannot sign; the build job still validates them.
    if: github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      #Pinned because newer runner images default to a JDK that .NET for Android does not support.
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: dotnet workload restore
        run: dotnet workload restore src/DcimCloudSync/DcimCloudSync.csproj

      - name: build-apk.ps1
        shell: pwsh
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
        run: ./build-apk.ps1 -OutputDirectory "$env:RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ needs.versioning.outputs.version }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 14

  #Pester tests for the repository scripts; they mock dotnet, git and adb, so no SDK or device is needed.
  script-tests:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install-Module Pester -RequiredVersion 5.7.1
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -RequiredVersion 5.7.1 -Force
      - name: Invoke-Pester .scripts/tests
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './.scripts/tests'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.TotalCount -eq 0 -or $result.FailedCount -gt 0) { exit 1 }

  release:
    needs: [lint, versioning, build, build-windows, build-apk, tests, script-tests]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false
